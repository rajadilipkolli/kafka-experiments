spring.application.name=spring-boot-kafka-avro-producer
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.properties.buffer.memory=33554432
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
app.producer.send-timeout-ms=12000

spring.kafka.properties.schema.registry.url=http://localhost:8081
spring.kafka.template.observation-enabled=true

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.endpoints.web.exposure.include=health,info,metrics,prometheus
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Basic versioning configuration
spring.mvc.apiversion.supported=1,2
spring.mvc.apiversion.default=1

# Path segment versioning (e.g., /person/v1/publish)
spring.mvc.apiversion.use.path-segment=1
